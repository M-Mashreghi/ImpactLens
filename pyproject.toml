[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "impactlens"
version = "1.0.0"
description = "Financial news to portfolio impact engine: evidence-backed, deterministic impact-priority scoring."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    # Windows ships no IANA timezone database; zoneinfo needs it for exchange calendars.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35"]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyyaml>=6",
    "streamlit>=1.35",
]

[project.scripts]
impactlens = "impactlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
impactlens = ["py.typed", "storage/migrations/*.sql", "intelligence/prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: tests that hit real external services (deselected by default in CI)",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008", "E501"]  # long lines are left to the formatter

[tool.mypy]
python_version = "3.12"
files = ["src/impactlens"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
exclude = ["src/impactlens/dashboard/"]
